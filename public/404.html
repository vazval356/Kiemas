<!doctype html>
<!--
  Página de «no encontrado» · Kiemas

  Vercel sirve este fichero cuando la dirección pedida no existe en el
  despliegue. Es HTML estático y suelto a propósito: no importa nada del
  paquete de la app, así que sigue funcionando aunque el JavaScript falle al
  compilar o el servicio esté a medio desplegar — que es precisamente cuando
  más gente acaba aquí.

  Ojo con lo que NO cubre: las rutas de la aplicación viven detrás de `#/`, y
  el fragmento no se manda al servidor. Un `/#/sitio-que-no-existe` llega aquí
  como una petición a `/` y la resuelve la app, no esta página. De eso se
  encarga `src/pages/NotFoundPage.tsx`.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esta página no existe · Kiemas</title>
    <meta name="description" content="La dirección que has abierto no existe en Kiemas." />
    <!-- Que no se indexe: un 404 en los resultados de búsqueda no le sirve a
         nadie. `follow` sí, para que los enlaces de abajo se sigan recorriendo. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#4648d4" />
    <style>

        font-weight: 200 800;
        font-display: swap;
        src: url('/fonts/manrope-latin-ext-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

        font-display: swap;

      }
      :root {
        color-scheme: light dark;
        --fondo: #f9f9ff;
        --tarjeta: #ffffff;
        --texto: #1b1b20;
        --suave: #55555f;
        --marca: #4648d4;

    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />

      <h1>Esta página no existe</h1>
      <p>

      <p><a class="boton" href="/">Ir a Kiemas</a></p>
      <nav aria-label="Páginas legales">

  </body>
</html>
